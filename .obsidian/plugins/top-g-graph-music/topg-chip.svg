<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Top G chip tile (HD vector, transparent background) - by TDOD -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/>
      <stop offset=".35" stop-color="#4fb4ff"/>
      <stop offset=".75" stop-color="#1a5fe0"/>
      <stop offset="1" stop-color="#0a2a78"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ec3ff"/>
      <stop offset=".45" stop-color="#1b7cf2"/>
      <stop offset="1" stop-color="#0b2f8f"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#021a55" flood-opacity=".55"/>
    </filter>
  </defs>
  <g transform="rotate(-9 128 128)" filter="url(#shadow)">
    <!-- tile: bevel rim + face -->
    <rect x="30" y="30" width="196" height="196" rx="44" fill="url(#rim)"/>
    <rect x="38" y="38" width="180" height="180" rx="38" fill="url(#face)"/>
    <rect x="38" y="38" width="180" height="180" rx="38" fill="none" stroke="#0a2a78" stroke-opacity=".5" stroke-width="2"/>
    <!-- circuit traces -->
    <g fill="none" stroke="#c9f4ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M160 112 H184 L198 98"/>
      <path d="M160 128 H206"/>
      <path d="M160 144 H182 L196 160"/>
      <path d="M128 160 V186 L114 200"/>
      <path d="M144 160 V178 H170 L182 190"/>
      <path d="M112 160 V172 L92 192"/>
      <path d="M96 120 H72 L60 108"/>
      <path d="M96 140 H66"/>
      <path d="M120 96 V74 L132 62"/>
      <path d="M140 96 V68"/>
    </g>
    <g fill="#ffffff" stroke="#7fe0ff" stroke-width="3" filter="url(#glow)">
      <circle cx="198" cy="98" r="7"/>
      <circle cx="206" cy="128" r="7"/>
      <circle cx="196" cy="160" r="7"/>
      <circle cx="114" cy="200" r="7"/>
      <circle cx="182" cy="190" r="7"/>
      <circle cx="92" cy="192" r="7"/>
      <circle cx="60" cy="108" r="7"/>
      <circle cx="66" cy="140" r="7"/>
      <circle cx="132" cy="62" r="7"/>
      <circle cx="140" cy="68" r="6"/>
    </g>
    <!-- chip -->
    <rect x="96" y="96" width="64" height="64" rx="12" fill="url(#core)"/>
    <rect x="96" y="96" width="64" height="64" rx="12" fill="none" stroke="#f2fdff" stroke-width="9" filter="url(#glow)"/>
    <rect x="114" y="114" width="28" height="28" rx="5" fill="#ffffff" fill-opacity=".9" filter="url(#glow)"/>
    <!-- gloss -->
    <path d="M46 70 Q46 46 70 46 H186 Q206 46 210 62 Q150 58 104 92 Q70 116 46 150 Z" fill="url(#gloss)" opacity=".55"/>
  </g>
</svg>
